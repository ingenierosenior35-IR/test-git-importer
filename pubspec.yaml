name: Rival
description: A new Flutter project.
version: 1.0.0+1
environment: 
  sdk: '>=3.5.3 <4.0.0'
dependencies: 
  flutter: 
    sdk: flutter
  cupertino_icons: ^1.0.8
  get:
  connectivity_plus: ^7.0.0
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.1
  pin_code_fields: ^8.0.1
  carousel_slider: ^5.1.1
  smooth_page_indicator: ^1.2.1
  sms_autofill: ^2.4.1
  another_stepper: ^1.2.2
  flutter_svg_provider: ^1.0.7
  intl: ^0.20.2
  percent_indicator: ^4.2.5
  pinput: ^5.0.0
  flutter_staggered_animations: ^1.1.1
  page_transition: ^2.2.1
  flick_video_player: ^0.9.0
  # Firebase dependencies
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.2
  firebase_storage: ^12.0.1
  google_sign_in: ^6.2.3
  flutter_facebook_auth: ^7.1.5
  intl_phone_field: ^3.2.0
  # Image picker and permissions
  image_picker: ^1.0.7
  permission_handler: ^11.2.0
  # Google Fonts
  google_fonts: ^6.1.0
  # HTTP client
  http: ^1.1.0
  # File picker
  file_picker: ^6.1.1
  # Charts
  fl_chart: ^0.66.0
  # Clean Architecture
  dartz: ^0.10.1
  equatable: ^2.0.5
dev_dependencies:
  flutter_test: 
    sdk: flutter

flutter: 
  uses-material-design: true
  assets: 
    - assets/
    - assets/images/
  fonts: 
    - family: Uniform Pro Extra Condensed
      fonts: 
        - asset: assets/fonts/UniformProXconBld.ttf
          weight: 700
        - asset: assets/fonts/UniformProXconMed.ttf
          weight: 500
        - asset: assets/fonts/UniformProXconReg.ttf
          weight: 400
    - family: SF Pro Display
      fonts: 
        - asset: assets/fonts/SFProDisplayRegular.ttf
          weight: 400
        - asset: assets/fonts/SFProDisplayBold.ttf
          weight: 700
